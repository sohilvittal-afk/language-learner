name: CI smoke check

# Lightweight sanity check: installs dependencies and confirms the server
# actually boots. No test framework exists in this repo yet, so this just
# guards against "it doesn't even start" regressions before a merge into
# staging or main.

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Boot the server and check it responds
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4000/login.html > /dev/null; then
              echo "Server responded."
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not respond on port 4000."
          kill $SERVER_PID
          exit 1
